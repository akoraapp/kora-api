<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-50:#F4EFEA; --brown-100:#E8DDD9; --brown-200:#C4A098; --brown-300:#A0736B;
    --brown-500:#7A4E48; --brown-600:#4A2E2A; --brown-800:#2D1C19; --brown-900:#1F1918;
    --coral-50:#FDF0EE; --coral-100:#F9D0C8; --coral-200:#F2A898; --coral-400:#E87C66;
    --coral-500:#D85E46; --coral-600:#B84030; --coral-800:#7A2016;
    --bg:#FAF8F6; --card:#FFFFFF; --surface:#F4EFEA;
    --text-primary:#2D1C19; --text-secondary:#8A6E68; --text-muted:#B8A09C;
    --border:#E0D6D0; --border-strong:#C4A098;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:48px; --s10:64px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text-primary); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  #app{ display:flex; width:100%; min-height:100vh; background:var(--bg); }
  .sidebar{ width:264px; flex-shrink:0; background:var(--card); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:var(--s6) var(--s4); position:fixed; top:0; left:0; bottom:0; }
  .sidebar-brand{ font-family:'Playfair Display'; font-weight:700; font-size:22px; color:var(--brown-800); padding:0 var(--s3); margin-bottom:var(--s8); display:flex; align-items:center; gap:10px; }
  .sidebar-brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--coral-500); }
  .sidebar-nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .sidebar-item{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px; color:var(--text-secondary); cursor:pointer; font-size:14px; font-weight:500; transition:all .15s ease; white-space:nowrap; }
  .sidebar-item svg{ flex-shrink:0; }
  .sidebar-item:hover{ background:var(--surface); color:var(--brown-800); }
  .sidebar-item.active{ background:var(--brown-600); color:#fff; }
  .sidebar-footer{ border-top:1px solid var(--border); padding-top:var(--s4); margin-top:var(--s4); display:flex; align-items:center; gap:10px; padding-left:14px; cursor:pointer; border-radius:12px; }
  .sidebar-footer:hover{ background:var(--surface); }
  .sidebar-footer .name{ font-size:13px; font-weight:600; color:var(--brown-800); }
  .sidebar-footer .role{ font-size:11px; color:var(--text-muted); }
  #main-area{ flex:1; margin-left:264px; min-height:100vh; position:relative; }
  #screen-content{ max-width:1040px; margin:0 auto; padding-bottom:var(--s9); }
  h1,h2,h3,.display{ font-family:'Playfair Display',serif; font-weight:700; color:var(--brown-800); }
  .muted{ color:var(--text-muted); } .secondary{ color:var(--text-secondary); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:var(--s7) var(--s7) var(--s5); }
  .topbar .greet{ font-size:26px; } .topbar .sub{ font-size:13px; color:var(--text-secondary); margin-top:2px; }
  .icon-btn{ width:40px; height:40px; border-radius:12px; background:var(--card); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s ease; flex-shrink:0; }
  .icon-btn:hover{ border-color:var(--border-strong); }
  .avatar{ width:40px; height:40px; border-radius:50%; background:var(--brown-600); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; }
  .topbar-actions{ display:flex; gap:var(--s3); align-items:center; }
  .topbar-back{ display:flex; align-items:center; gap:var(--s3); }

  main{ padding:0 var(--s7); }
  .section-title{ font-size:19px; margin:var(--s7) 0 var(--s4); display:flex; align-items:center; justify-content:space-between; }
  .section-title .see-all{ font-family:'Inter'; font-weight:500; font-size:13px; color:var(--brown-600); cursor:pointer; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:20px; padding:var(--s5); box-shadow:0 1px 3px rgba(45,28,25,0.04); margin-bottom:var(--s4); }
  .card-row{ display:flex; align-items:center; gap:var(--s4); }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:var(--s4); }
  .stat-card{ background:var(--card); border:1px solid var(--border); border-radius:20px; padding:var(--s5); }
  .stat-label{ font-size:12px; color:var(--text-secondary); font-weight:500; margin-bottom:var(--s2); }
  .stat-value{ font-size:22px; font-weight:700; color:var(--brown-800); font-family:'Inter'; }
  .stat-value.coral{ color:var(--coral-600); }
  .stat-delta{ font-size:12px; margin-top:var(--s2); color:#5D8A5A; font-weight:500; }

  .progress-track{ width:100%; height:8px; border-radius:8px; background:var(--surface); overflow:hidden; margin-top:var(--s3); }
  .progress-fill{ height:100%; background:var(--brown-600); border-radius:8px; transition:width .3s ease; }

  .list-item{ display:flex; align-items:center; gap:var(--s4); padding:var(--s4) 0; border-bottom:1px solid var(--border); cursor:default; }
  .list-item:last-child{ border-bottom:none; }
  .list-item.clickable{ cursor:pointer; }
  .list-icon{ width:40px; height:40px; border-radius:12px; background:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--brown-600); }
  .list-title{ font-size:14px; font-weight:600; color:var(--brown-800); }
  .list-sub{ font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .list-right{ margin-left:auto; text-align:right; font-size:12px; color:var(--text-secondary); }

  .badge{ font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; display:inline-block; white-space:nowrap; }
  .badge-lead{ background:var(--surface); color:var(--brown-500); }
  .badge-negociacao{ background:var(--coral-50); color:var(--coral-600); }
  .badge-contrato{ background:#FDF3E3; color:#C28A3D; }
  .badge-assinado{ background:#EAF3E9; color:#5D8A5A; }
  .badge-producao{ background:var(--brown-100); color:var(--brown-600); }
  .badge-finalizado{ background:var(--brown-600); color:#fff; }
  .badge-baixa{ background:var(--surface); color:var(--brown-500); }
  .badge-media{ background:#FDF3E3; color:#C28A3D; }
  .badge-alta{ background:var(--coral-50); color:var(--coral-600); }

  .empty-state{ text-align:center; padding:var(--s9) var(--s5); color:var(--text-muted); }
  .empty-state svg{ margin-bottom:var(--s4); opacity:.5; }
  .empty-state .title{ color:var(--brown-800); font-weight:600; font-size:15px; margin-bottom:var(--s2); }
  .empty-state .desc{ font-size:13px; }

  .btn{ font-family:'Inter'; font-weight:600; font-size:14px; border-radius:12px; padding:12px 20px; border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:all .2s ease; }
  .btn-primary{ background:var(--brown-600); color:#fff; } .btn-primary:hover{ background:var(--brown-500); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-secondary{ background:#fff; color:var(--brown-600); border-color:var(--border); } .btn-secondary:hover{ border-color:var(--border-strong); }
  .btn-accent{ background:var(--coral-500); color:#fff; } .btn-accent:hover{ background:var(--coral-600); }
  .btn-block{ width:100%; } .btn-sm{ padding:8px 14px; font-size:12px; border-radius:10px; }
  .fab{ position:fixed; bottom:36px; right:36px; width:56px; height:56px; border-radius:18px; background:var(--brown-600); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 20px rgba(74,46,42,0.28); border:none; z-index:20; transition:transform .2s ease; }
  .fab:hover{ transform:scale(1.06); }

  .quick-actions{ display:flex; gap:var(--s6); justify-content:center; padding:var(--s2) 0 var(--s3); }
  .qa-item{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:var(--s3); cursor:pointer; width:104px; }
  .qa-icon{ width:72px; height:72px; border-radius:20px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--brown-600); transition:all .2s ease; }
  .qa-item:hover .qa-icon{ background:var(--surface); border-color:var(--border-strong); transform:translateY(-2px); }
  .qa-label{ font-size:13px; text-align:center; color:var(--text-secondary); font-weight:600; }

  .filter-row{ display:flex; gap:var(--s2); overflow-x:auto; padding:var(--s2) 0 var(--s5); }
  .filter-chip{ flex:0 0 auto; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:500; border:1px solid var(--border); background:#fff; color:var(--text-secondary); cursor:pointer; transition:all .2s ease; }
  .filter-chip.active{ background:var(--brown-600); color:#fff; border-color:var(--brown-600); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(31,25,24,0.45); display:none; align-items:center; justify-content:center; z-index:100; padding:var(--s6); }
  .modal-overlay.open{ display:flex; }
  .modal{ background:#fff; width:100%; max-width:560px; border-radius:20px; padding:var(--s7); max-height:86vh; overflow-y:auto; animation:modalIn .2s ease; box-shadow:0 24px 60px rgba(31,25,24,0.25); }
  @keyframes modalIn{ from{ transform:translateY(12px) scale(.98); opacity:0; } to{ transform:translateY(0) scale(1); opacity:1; } }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--s6); }
  .modal-title{ font-size:18px; }
  .field{ margin-bottom:var(--s4); }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:var(--s2); }
  .field-hint{ font-size:11px; color:var(--text-muted); margin-top:4px; }
  .field input, .field select, .field textarea{ width:100%; border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-family:'Inter'; font-size:14px; background:#fff; color:var(--text-primary); transition:border-color .2s ease; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--brown-600); }
  .field-row{ display:flex; gap:var(--s3); } .field-row .field{ flex:1; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); }
  .toggle-row:last-child{ border-bottom:none; }
  .toggle{ width:44px; height:26px; border-radius:20px; background:var(--border); position:relative; cursor:pointer; transition:background .2s ease; flex-shrink:0; }
  .toggle.on{ background:var(--brown-600); }
  .toggle-dot{ width:20px; height:20px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:transform .2s ease; box-shadow:0 1px 2px rgba(0,0,0,0.2); }
  .toggle.on .toggle-dot{ transform:translateX(18px); }
  .toast{ position:fixed; bottom:110px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--brown-800); color:#fff; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:500; opacity:0; transition:all .25s ease; z-index:200; pointer-events:none; white-space:nowrap; max-width:90%; text-overflow:ellipsis; overflow:hidden; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .more-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:var(--s4); }
  .more-tile{ background:var(--card); border:1px solid var(--border); border-radius:20px; padding:var(--s5); cursor:pointer; transition:all .2s ease; }
  .more-tile:hover{ border-color:var(--border-strong); }
  .more-tile .list-icon{ margin-bottom:var(--s4); }
  .more-tile .tile-title{ font-size:14px; font-weight:600; color:var(--brown-800); margin-bottom:2px; }
  .more-tile .tile-sub{ font-size:11px; color:var(--text-muted); }
  .soon-pill{ font-size:10px; font-weight:700; color:var(--coral-600); background:var(--coral-50); padding:2px 8px; border-radius:10px; display:inline-block; margin-top:var(--s2); }

  .swipe-row{ display:flex; gap:var(--s2); margin-left:var(--s2); flex-shrink:0; }
  .icon-action{ width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); transition:all .2s ease; }
  .icon-action:hover{ background:var(--surface); color:var(--brown-600); }
  .icon-action.danger:hover{ color:var(--coral-600); }

  .ai-tile{ background:linear-gradient(180deg,#fff,var(--surface)); border:1px solid var(--border); border-radius:20px; padding:var(--s5); cursor:pointer; transition:all .2s ease; margin-bottom:var(--s4); }
  .ai-tile:hover{ border-color:var(--brown-300); }
  .ai-tile-top{ display:flex; align-items:center; gap:var(--s4); }
  .ai-badge{ font-size:10px; font-weight:700; color:var(--coral-600); background:var(--coral-50); padding:3px 9px; border-radius:10px; display:inline-block; }

  .tab-pills{ display:flex; gap:var(--s2); background:var(--surface); border-radius:14px; padding:4px; margin-bottom:var(--s5); }
  .tab-pill{ flex:1; text-align:center; padding:9px 6px; border-radius:11px; font-size:12px; font-weight:600; color:var(--text-secondary); cursor:pointer; transition:all .2s ease; }
  .tab-pill.active{ background:#fff; color:var(--brown-800); box-shadow:0 1px 3px rgba(45,28,25,0.08); }

  .ai-result{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:var(--s4); font-size:13px; line-height:1.6; white-space:pre-wrap; color:var(--brown-800); max-height:340px; overflow-y:auto; font-family:'Inter'; }
  .spinner{ width:18px; height:18px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .price-result{ background:var(--brown-600); color:#fff; border-radius:20px; padding:var(--s6); text-align:center; margin-top:var(--s5); }
  .price-result .amount{ font-size:32px; font-family:'Playfair Display'; font-weight:700; margin:var(--s2) 0; }
  .price-breakdown{ text-align:left; margin-top:var(--s5); border-top:1px solid rgba(255,255,255,0.2); padding-top:var(--s4); }
  .price-breakdown div{ display:flex; justify-content:space-between; font-size:12px; padding:4px 0; color:rgba(255,255,255,0.85); }
  .range-track{ width:100%; height:6px; border-radius:6px; background:rgba(255,255,255,0.15); margin-top:var(--s3); position:relative; }
  .range-fill{ position:absolute; top:0; height:6px; border-radius:6px; background:#fff; }
  .impact-row{ display:flex; align-items:center; justify-content:space-between; padding:var(--s4) 0; border-bottom:1px solid var(--border); }
  .impact-row:last-child{ border-bottom:none; }
  .impact-label{ font-size:13px; font-weight:600; color:var(--brown-800); display:flex; align-items:center; gap:8px; }
  .impact-sub{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .impact-pill{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:10px; }
  .impact-pill.on{ background:#EAF3E9; color:#5D8A5A; }
  .impact-pill.off{ background:var(--surface); color:var(--text-muted); }
  .crm-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--s3); margin-bottom:var(--s2); }
  .crm-stat{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:var(--s4); }
  .crm-stat .n{ font-size:20px; font-weight:700; color:var(--brown-800); font-family:'Inter'; }
  .crm-stat .l{ font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-weekdays{ margin-bottom:6px; }
  .cal-weekdays div{ text-align:center; font-size:11px; font-weight:600; color:var(--text-muted); }
  .cal-cell{ min-height:64px; display:flex; flex-direction:column; align-items:stretch; border-radius:8px; padding:3px; cursor:pointer; position:relative; transition:all .15s ease; border:1px solid transparent; }
  .cal-cell:hover{ background:var(--surface); }
  .cal-cell .daynum{ font-size:11px; color:var(--text-secondary); text-align:center; margin-bottom:2px; }
  .cal-cell.today .daynum{ font-weight:700; color:var(--brown-600); }
  .cal-cell.sel{ border-color:var(--brown-600); background:var(--surface); }
  .cal-chip{ font-size:9px; line-height:1.3; background:var(--brown-100); color:var(--brown-800); border-radius:4px; padding:1px 4px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-chip.pub{ background:#EAF3E9; color:#5D8A5A; }
  .cal-more{ font-size:9px; color:var(--text-muted); text-align:center; }
  .goal-card{ background:var(--brown-600); border-radius:20px; padding:var(--s5); color:#fff; cursor:pointer; margin-top:var(--s5); margin-bottom:var(--s4); transition:transform .2s ease; }
  .goal-card:hover{ transform:translateY(-1px); }
  .goal-card .top-row{ display:flex; align-items:center; justify-content:space-between; }
</style>
</head>
<body>
<div id="app">
  <nav class="sidebar" id="sidebarNav"></nav>
  <div id="main-area">
    <div id="screen-content"></div>
    <button class="fab" id="fabBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Icons ---------- */
const ICONS = {
  home: `<path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5Z"/>`,
  users: `<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
  calendar: `<rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>`,
  dollar: `<circle cx="12" cy="12" r="10"/><path d="M12 6v12M15.5 9.5c0-1.4-1.5-2.5-3.5-2.5s-3.5 1.1-3.5 2.7c0 3.4 7 1.6 7 5 0 1.7-1.6 2.8-3.5 2.8s-3.5-1.1-3.5-2.5"/>`,
  more: `<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>`,
  bell: `<path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/>`,
  plus: `<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>`,
  x: `<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`,
  pencil: `<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>`,
  trash: `<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>`,
  chevron: `<polyline points="9 18 15 12 9 6"/>`,
  back: `<polyline points="15 18 9 12 15 6"/>`,
  briefcase: `<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>`,
  clock: `<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,
  check: `<polyline points="20 6 9 17 4 12"/>`,
  lightbulb: `<path d="M9 18h6M10 22h4M15.09 14c.35-.68 1-1.06 1.6-1.56A6 6 0 0 0 12 2a6 6 0 0 0-4.69 10.44c.6.5 1.25.88 1.6 1.56.35.67.35 1.5.35 2h5.48c0-.5 0-1.33.35-2Z"/>`,
  sparkles: `<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>`,
  file: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/>`,

/* ---------- Storage ---------- */
async function loadAll(){
  for(const key of ['clients','content','ideas','transactions','tiktok','contracts','estimates','performance','referrals']){
    try{ const res = await window.storage.get('akora:'+key); STATE[key] = res ? JSON.parse(res.value) : []; }
    catch(e){ STATE[key] = []; }
  }
  try{ const res = await window.storage.get('akora:profile'); STATE.profile = res ? JSON.parse(res.value) : {}; }
  catch(e){ STATE.profile = {}; }
  try{
    const res = await window.storage.get('akora:settings');
    if(res){ const s = JSON.parse(res.value); STATE.language = s.language||'pt'; STATE.currency = s.currency||'BRL'; STATE.goal = s.goal||20000; STATE.referralCode = s.referralCode||''; }
  }catch(e){ /* keep defaults */ }
  if(!STATE.referralCode){
    const base = (STATE.profile.name||'creator').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').slice(0,10) || 'creator';
    STATE.referralCode = base + Math.random().toString(36).slice(2,6);
    await saveSettings();
  }
}
async function saveSettings(){
  try{ await window.storage.set('akora:settings', JSON.stringify({ language: STATE.language, currency: STATE.currency, goal: STATE.goal, referralCode: STATE.referralCode })); }
  catch(e){ showToast('Erro ao salvar configurações'); }
}
async function save(key){
  try{ await window.storage.set('akora:'+key, JSON.stringify(STATE[key])); }
  catch(e){ showToast('Erro ao salvar dados'); }
}

/* ---------- Claude API helper ---------- */
async function callAI(systemPrompt, userPrompt){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: "user", content: userPrompt }],
    })
  });
  const data = await response.json();
  if(data.error) throw new Error(data.error.message || 'Erro na IA');
  return (data.content||[]).map(b=>b.text||'').join('\n').trim();
}

/* ---- Notifications ---- */
function getNotifications(){
  const todayStr = new Date().toISOString().slice(0,10);
  const in3days = new Date(Date.now()+3*86400000).toISOString().slice(0,10);
  const list = [];
  STATE.content.forEach(c=>{
    if(c.dueDate && c.dueDate < todayStr && c.status!=='Publicado'){
      list.push({ icon:'clock', color:'var(--coral-600)', title:`Atrasado: ${c.title}`, sub:`Prazo era ${fmtDate(c.dueDate)} · ${c.status}` });
    } else if(c.dueDate && c.dueDate>=todayStr && c.dueDate<=in3days && c.status!=='Publicado'){
      list.push({ icon:'calendar', color:'var(--brown-600)', title:`Entrega em breve: ${c.title}`, sub:`${fmtDate(c.dueDate)} · ${c.status}` });
    }
  });
  STATE.transactions.forEach(t=>{
    if(t.status==='Pendente' && t.type==='Receita'){
      list.push({ icon:'dollar', color:'var(--coral-600)', title:`Pagamento pendente`, sub:`${esc(t.description)} · ${fmtBRL(t.amount)}` });
    }
  });
  STATE.clients.forEach(c=>{
    if(c.status==='Contrato Enviado'){
      list.push({ icon:'file', color:'var(--brown-600)', title:`Contrato aguardando resposta`, sub:esc(c.name) });
    }
  });
  return list;
}

async function bindAssistant(){
  const list = getNotifications();
  if(!list.length) return;
  try{
    const system = "Você é a assistente virtual dentro do app AKORA, que ajuda criadores de conteúdo a organizar clientes, conteúdos, prazos e finanças. Fale em português do Brasil, num tom acolhedor, direto e profissional, como uma assistente pessoal avisando a criadora sobre o que precisa de atenção. Máximo 3 frases curtas.";
    const user = `Aqui estão as pendências reais da criadora agora: ${list.map(n=>`${n.title} (${n.sub})`).join('; ')}. Resuma isso como um aviso da assistente, priorizando o mais urgente primeiro.`;
    const text = await callAI(system, user);
    const box = document.getElementById('assistantSummaryText');
    if(box) box.textContent = text;
  }catch(e){
    const box = document.getElementById('assistantSummaryText');
    if(box) box.textContent = `Você tem ${list.length} pendência(s) pra olhar — confira os detalhes abaixo.`;

}

let panelFilters = { status:'criados', platform:'Todas', niche:'Todos' };
function contentPanel(){
  const platforms = ['Todas','Instagram','TikTok','YouTube','Blog','Outra'];
  const niches = ['Todos', ...NICHE_OPTIONS];
  const byStatus = c => {
    if(panelFilters.status==='entregues') return c.status==='Publicado';
    if(panelFilters.status==='pendentes') return c.status==='Enviado';
    return true;
  };
  const filtered = STATE.content.filter(c=> byStatus(c)
    && (panelFilters.platform==='Todas' || c.platform===panelFilters.platform)
    && (panelFilters.niche==='Todos' || c.niche===panelFilters.niche));
  const counts = {
    criados: STATE.content.length,
    entregues: STATE.content.filter(c=>c.status==='Publicado').length,
    pendentes: STATE.content.filter(c=>c.status==='Enviado').length,
  };
  return `
    <div class="filter-row" style="padding-top:0">
      <div class="filter-chip ${panelFilters.status==='criados'?'active':''}" data-panelstatus="criados">Criados (${counts.criados})</div>

    </div>
    <div class="field-row">
      <div class="field"><label>Plataforma</label><select id="panelPlatform">${platforms.map(p=>`<option value="${p}" ${panelFilters.platform===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="field"><label>Nicho</label><select id="panelNiche">${niches.map(n=>`<option value="${n}" ${panelFilters.niche===n?'selected':''}>${n}</option>`).join('')}</select></div>
    </div>
    ${filtered.length ? `<div class="card">${filtered.slice(0,8).map(c=>`
      <div class="list-item"><div class="list-icon">${icon('calendar',18)}</div>
        <div style="flex:1"><div class="list-title">${esc(c.title)}</div><div class="list-sub">${esc(c.platform||'')}${c.niche?(' · '+esc(c.niche)):''}${c.dueDate?(' · '+fmtDate(c.dueDate)):''}</div></div>
        <select class="quick-status" data-quickstatus-main="${c.id}" style="font-size:11px;padding:5px 6px;border-radius:8px;border:1px solid var(--border);color:var(--text-secondary);max-width:105px">${STATUS_CONTENT.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>`).join('')}</div>` : emptyState('calendar','Nada por aqui com esse filtro','Tente outra combinação de status, plataforma ou nicho.')}`;

const WEEKDAY_LABELS = ['D','S','T','Q','Q','S','S'];
const MONTH_LABELS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function contentCalendar(){
  const { year, month, selected } = calState;
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayISO = new Date().toISOString().slice(0,10);
  const contentByDay = {};
  STATE.content.forEach(c=>{ if(c.dueDate){ (contentByDay[c.dueDate] = contentByDay[c.dueDate]||[]).push(c); } });
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = contentByDay[iso] || [];
    const visible = items.slice(0,2);
    const extra = items.length - visible.length;
    cells += `<div class="cal-cell ${iso===selected?'sel':''} ${iso===todayISO?'today':''}" data-day="${iso}">
      <div class="daynum">${d}</div>
      ${visible.map(c=>`<div class="cal-chip ${c.status==='Publicado'?'pub':''}" title="${esc(c.title)}">${esc(c.title)}</div>`).join('')}
      ${extra>0 ? `<div class="cal-more">+${extra}</div>` : ''}
    </div>`;
  }
  return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)">
        <div class="icon-btn" data-calnav="-1">${icon('back',16,'#4A2E2A')}</div>
        <div class="list-title" style="font-size:15px">${MONTH_LABELS[month]} ${year}</div>
        <div class="icon-btn" data-calnav="1">${icon('chevron',16,'#4A2E2A')}</div>
      </div>
      <div class="cal-grid cal-weekdays">${WEEKDAY_LABELS.map(w=>`<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="field-hint" style="margin:0 0 var(--s2)">Toque num dia vazio pra criar, ou num dia com conteúdo pra ver/editar.</div>`;
}

function bindToggle(id){ const t = document.getElementById(id); t.addEventListener('click', ()=> t.classList.toggle('on')); }
function bindScriptGenerate(){
  document.getElementById('genScriptBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('genScriptBtn');
    const topic = val('sc-topic');
    if(!topic){ showToast('Descreva o tema do conteúdo'); return; }
    const f = { topic, lang: val('sc-lang'), type: val('sc-type'), objective: val('sc-objective'), duration: val('sc-duration'), platform: val('sc-platform'), niche: val('sc-niche'), client: val('sc-client'), voiceover: val('sc-voiceover') };
    btn.disabled = true; btn.innerHTML = `<div class="spinner"></div> Gerando...`;
    try{
      const langMap = { 'Português':'português do Brasil', 'Inglês':'English', 'Espanhol':'español' };
      const system = `Você é um roteirista especialista em conteúdo de criadores digitais. Escreva sempre no idioma solicitado: ${langMap[f.lang]}.`;
      const user = `Escreva um roteiro de ${f.type} para ${f.platform}, com duração de ${f.duration}, sobre o tema "${f.topic}", nicho ${f.niche||'geral'}, com objetivo de ${f.objective}, no estilo "${f.voiceover}".${f.client?(' O conteúdo é para a marca '+f.client+'.'):''} Estruture com: Gancho (primeiros 3s), Desenvolvimento, Call to action final. Seja direto e pronto para gravar.`;
      const text = await callAI(system, user);
      document.getElementById('scriptResultBox').innerHTML = `
        <div class="section-title" style="margin-top:var(--s6)">Roteiro gerado</div>
        <div class="ai-result" id="scriptText" contenteditable="true">${esc(text)}</div>
        <div style="display:flex;gap:var(--s3);margin-top:var(--s4)">
          <button class="btn btn-secondary" style="flex:1" id="copyScript">${icon('copy',15)} Copiar</button>
          <button class="btn btn-primary" style="flex:1" id="saveScriptContent">${icon('check',15)} Criar conteúdo</button>
        </div>`;
      document.getElementById('copyScript').addEventListener('click', ()=>{ navigator.clipboard.writeText(document.getElementById('scriptText').innerText); showToast('Roteiro copiado'); });
      document.getElementById('saveScriptContent').addEventListener('click', async ()=>{
        STATE.content.push({ id: uid(), title: f.topic, platform: f.platform, client: f.client, status:'Roteiro', dueDate:'', script: document.getElementById('scriptText').innerText });
        await save('content'); closeModal(); contentSub='fluxo'; render(); showToast('Conteúdo criado com o roteiro');
      });
    }catch(e){ showToast('Erro ao gerar roteiro: ' + e.message); }
    btn.disabled = false; btn.innerHTML = `${icon('sparkles',16)} Gerar roteiro`;
  });
}

/* ---- Pricing Engine ---- */
function opts(labels, values, selectedIdx, showSub){
  return labels.map((o,i)=>{
    const text = typeof o === 'string' ? o : o.l + (showSub && o.s ? (' — '+o.s) : '');
    return `<option value="${values[i]}" ${i===selectedIdx?'selected':''}>${text}</option>`;
  }).join('');
}

function bindPricing(){
  ['pr-script','pr-voice','pr-raw','pr-edit','pr-retainer'].forEach(bindToggle);
  document.getElementById('calcPriceBtn').addEventListener('click', ()=>{
    const L = pl();
    const base = 220;
    const tier = parseFloat(val('pr-tier')||1), qty = parseInt(val('pr-qty')||1);
    const complexity = parseFloat(val('pr-complexity')||1), usage = parseFloat(val('pr-usage')||1), speed = parseFloat(val('pr-speed')||1);
    const style = document.getElementById('pr-style').selectedOptions[0].text, platform = val('pr-platform');
    const scriptOn = document.getElementById('pr-script').classList.contains('on');
    const voiceOn = document.getElementById('pr-voice').classList.contains('on');
    const rawOn = document.getElementById('pr-raw').classList.contains('on');
    const editOn = document.getElementById('pr-edit').classList.contains('on');
    const retainerOn = document.getElementById('pr-retainer').classList.contains('on');
    let extras = 0;
    if(scriptOn) extras += 60; if(voiceOn) extras += 45; if(rawOn) extras += 80; if(editOn) extras += 90;
    const creativeBase = base * tier;
    let unit = (creativeBase * complexity * usage * speed) + extras;
    let total = unit * qty;
    if(retainerOn) total = total * 3.5;
    const low = total * 0.88, high = total * 1.3;
    const pctUsage = Math.round((usage-1)*100), pctComplexity = Math.round((complexity-1)*100), pctSpeed = Math.round((speed-1)*100);
    STATE._lastEstimate = { total, low, high, tier, style, platform, qty, complexity, usage, speed, extras, scriptOn, voiceOn, rawOn, editOn, retainerOn, creativeBase };
    document.getElementById('priceResultBox').innerHTML = `
      <div class="section-title" style="margin-top:var(--s6)">${L.marketEval}</div>
      <div class="price-result">
        <div class="stat-label" style="color:rgba(255,255,255,0.75)">${L.suggestedRate}</div>
        <div class="amount">${fmtBRL(total)}</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.75)">${L.recRange}: ${fmtBRL(low)} – ${fmtBRL(high)}</div>
        <div class="range-track"><div class="range-fill" style="left:20%;width:35%"></div></div>
        <div class="price-breakdown">
          <div><span>${L.creativeBase}</span><span>${fmtBRL(creativeBase)}</span></div>
          <div><span>${L.extras}</span><span>${fmtBRL(extras)}</span></div>
          <div><span>${L.quantity}</span><span>×${qty}</span></div>
          ${retainerOn ? `<div><span>${L.retainerPkg}</span><span>×3.5</span></div>` : ''}
        </div>
      </div>
      <div class="section-title" style="margin-top:var(--s6)">${L.matrix}</div>
      <div class="card">
        <div class="impact-row"><div><div class="impact-label">${icon('check',14)} ${L.usageImpact}</div><div class="impact-sub">${document.getElementById('pr-usage').selectedOptions[0].text}</div></div><span class="impact-pill ${pctUsage>0?'on':'off'}">${pctUsage>0?'+'+pctUsage+'%':'0%'}</span></div>
        <div class="impact-row"><div><div class="impact-label">${icon('clock',14)} ${L.timelineImpact}</div><div class="impact-sub">${document.getElementById('pr-speed').selectedOptions[0].text}</div></div><span class="impact-pill ${pctSpeed>0?'on':'off'}">${pctSpeed>0?'+'+pctSpeed+'%':'0%'}</span></div>
        <div class="impact-row"><div><div class="impact-label">${icon('sparkles',14)} ${L.complexityImpact}</div><div class="impact-sub">${document.getElementById('pr-complexity').selectedOptions[0].text}</div></div><span class="impact-pill ${pctComplexity>0?'on':'off'}">${pctComplexity>0?'+'+pctComplexity+'%':'0%'}</span></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)">
        <button class="btn btn-secondary" id="genProposalBtn">${icon('file',15)} ${L.genProposal}</button>
        <button class="btn btn-secondary" id="goContractBtn">${icon('sparkles',15)} ${L.genContract}</button>
        <button class="btn btn-secondary" id="createDealBtn">${icon('briefcase',15)} ${L.createDeal}</button>
        <button class="btn btn-primary" id="saveEstimateBtn">${icon('check',15)} ${L.saveEstimate}</button>
      </div>`;
    document.getElementById('genProposalBtn').addEventListener('click', ()=> openModal(proposalForm(STATE._lastEstimate), ()=>bindProposalGenerate(STATE._lastEstimate)));
    document.getElementById('goContractBtn').addEventListener('click', ()=>{
      showToast('Selecione o cliente em Clientes → perfil → Gerar contrato com IA');
      STATE.tab='clients'; STATE.clientDetailId=null; render();
    });
    document.getElementById('createDealBtn').addEventListener('click', ()=>{ closeModalIfOpen(); openModal(contentForm(null), ()=>bindContentSave(null)); });
    document.getElementById('saveEstimateBtn').addEventListener('click', async ()=>{
      STATE.estimates.push({ id: uid(), date:new Date().toISOString().slice(0,10), total, style, platform, qty });
      await save('estimates'); showToast('Estimativa salva');
    });
  });
}

function financeGeral(){
  const years = [2026,2027,2028,2029,2030];
  const monthIdx = financeFilter.month==='Todos' ? null : MONTH_SHORT.indexOf(financeFilter.month);
  const inScope = t => t.date && new Date(t.date).getFullYear()===financeFilter.year && (monthIdx===null || new Date(t.date).getMonth()===monthIdx);
  const scoped = STATE.transactions.filter(inScope);
  const income = scoped.filter(t=>t.type==='Receita' && t.status==='Pago').reduce((s,t)=>s+Number(t.amount),0);
  const expenses = scoped.filter(t=>t.type==='Despesa' && t.status==='Pago').reduce((s,t)=>s+Number(t.amount),0);
  const net = income - expenses;
  const sorted = [...scoped].sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  const now = new Date();
  const currentMonthIncome = STATE.transactions.filter(t=> t.date && t.status==='Pago' && t.type==='Receita' && new Date(t.date).getMonth()===now.getMonth() && new Date(t.date).getFullYear()===now.getFullYear()).reduce((s,t)=>s+Number(t.amount),0);

  const monthlyIncome = Array(12).fill(0), monthlyExpense = Array(12).fill(0);
  STATE.transactions.forEach(t=>{
    if(!t.date || t.status!=='Pago') return;
    const d = new Date(t.date);
    if(d.getFullYear()!==financeFilter.year) return;
    if(t.type==='Receita') monthlyIncome[d.getMonth()] += Number(t.amount); else monthlyExpense[d.getMonth()] += Number(t.amount);
  });
  const maxVal = Math.max(1, ...monthlyIncome, ...monthlyExpense);

  return `
    <div class="card" style="background:var(--brown-600);color:#fff;margin-bottom:var(--s5)">
      <div class="stat-label" style="color:rgba(255,255,255,0.75)">Receita deste mês (${MONTH_SHORT[now.getMonth()]}/${now.getFullYear()})</div>
      <div style="font-family:'Playfair Display';font-size:26px;font-weight:700;margin-top:2px">${fmtBRL(currentMonthIncome)}</div>
    </div>
    <div class="field-row">
      <div class="field"><label>Ano</label><select id="financeYear">${years.map(y=>`<option value="${y}" ${financeFilter.year===y?'selected':''}>${y}</option>`).join('')}</select></div>
      <div class="field"><label>Mês</label><select id="financeMonth"><option ${financeFilter.month==='Todos'?'selected':''}>Todos</option>${MONTH_SHORT.map(m=>`<option ${financeFilter.month===m?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <div class="card">
      <div class="stat-label" style="margin-bottom:var(--s4)">Faturamento em ${financeFilter.year}</div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:140px">
        ${MONTH_SHORT.map((m,i)=>`
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;opacity:${monthIdx===null||monthIdx===i?1:.35}">
            <div style="display:flex;align-items:flex-end;gap:3px;height:100%">
              <div style="width:10px;background:#5D8A5A;border-radius:3px 3px 0 0;height:${Math.max(2,(monthlyIncome[i]/maxVal)*100)}%" title="${m} receita"></div>
              <div style="width:10px;background:var(--coral-400);border-radius:3px 3px 0 0;height:${Math.max(2,(monthlyExpense[i]/maxVal)*100)}%" title="${m} despesa"></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted)">${m}</div>
          </div>`).join('')}
      </div>
      <div style="display:flex;gap:var(--s5);margin-top:var(--s4);font-size:12px;color:var(--text-secondary)">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#5D8A5A;margin-right:4px"></span>Receita</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--coral-400);margin-right:4px"></span>Despesa</span>
      </div>
    </div>
    <div class="stat-grid" style="margin-top:var(--s5)">
      <div class="stat-card"><div class="stat-label">Receita ${monthIdx===null?'do ano':'do mês'}</div><div class="stat-value" style="color:#5D8A5A">${fmtBRL(income)}</div></div>
      <div class="stat-card"><div class="stat-label">Despesas ${monthIdx===null?'do ano':'do mês'}</div><div class="stat-value coral">${fmtBRL(expenses)}</div></div>
    </div>
    <div class="card" style="text-align:center;margin-top:var(--s4)"><div class="stat-label">Lucro líquido</div><div class="display" style="font-size:28px;color:var(--brown-800)">${fmtBRL(net)}</div></div>
    <div class="section-title">Lançamentos ${monthIdx===null?('de '+financeFilter.year):(financeFilter.month+'/'+financeFilter.year)}</div>
    ${sorted.length ? `<div class="card">${sorted.map(t=>`
      <div class="list-item"><div class="list-icon" style="color:${t.type==='Receita'?'#5D8A5A':'var(--coral-600)'}">${icon(t.type==='Receita'?'arrowUp':'dollar',18)}</div>
        <div style="flex:1"><div class="list-title">${esc(t.description)}</div><div class="list-sub">${fmtDate(t.date)} · ${t.status}${t.client?(' · '+esc(t.client)):''}${t.method?(' · '+esc(t.method)):''}</div></div>
        <div class="list-right" style="font-weight:700;color:${t.type==='Receita'?'#5D8A5A':'var(--coral-600)'}">${t.type==='Receita'?'+':'-'} ${fmtBRL(t.amount)}</div></div>`).join('')}</div>` : emptyState('dollar','Nada por aqui nesse período','Toque no + para registrar uma receita ou despesa, ou tente outro filtro.')}`;
}

/* ---- Performance (manual tracking) ---- */
let perfPlatformFilter = 'Todas';
function screenPerformance(){
  const platforms = ['Todas','Instagram','TikTok','YouTube'];
  const entries = STATE.performance.filter(p=> perfPlatformFilter==='Todas' || p.platform===perfPlatformFilter).sort((a,b)=> b.date.localeCompare(a.date));
  const latest = entries[0], previous = entries[1];
  const growth = (latest && previous) ? (latest.followers - previous.followers) : 0;
  const totalViews = entries.reduce((s,e)=>s+Number(e.views||0),0);
  const avgEngagement = entries.length ? (entries.reduce((s,e)=>{
    const interactions = Number(e.likes||0)+Number(e.comments||0)+Number(e.shares||0)+Number(e.saves||0);
    return s + (e.views>0 ? (interactions/e.views*100) : 0);
  },0) / entries.length) : 0;
  return `
    ${topbar('Métricas manuais do creator')}
    <main>
      <div class="filter-row" style="padding-top:0">${platforms.map(p=>`<div class="filter-chip ${perfPlatformFilter===p?'active':''}" data-perfplatform="${p}">${p}</div>`).join('')}</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Seguidores (última medição)</div><div class="stat-value">${latest?latest.followers.toLocaleString('pt-BR'):'—'}</div>
          ${latest&&previous ? `<div class="stat-delta" style="color:${growth>=0?'#5D8A5A':'var(--coral-600)'}">${growth>=0?'+':''}${growth.toLocaleString('pt-BR')} desde a medição anterior</div>` : ''}</div>
        <div class="stat-card"><div class="stat-label">Visualizações somadas</div><div class="stat-value">${totalViews.toLocaleString('pt-BR')}</div></div>
      </div>
      <div class="card" style="text-align:center"><div class="stat-label">Engajamento médio</div><div class="display" style="font-size:26px;color:var(--brown-800)">${avgEngagement.toFixed(1)}%</div><div class="secondary" style="font-size:12px">(curtidas+comentários+compartilhamentos+salvamentos) ÷ views</div></div>
      <div style="display:flex;justify-content:flex-end;margin:var(--s4) 0"><button class="btn btn-secondary btn-sm" id="addPerfBtn">${icon('plus',14)} Registrar métricas</button></div>
      <div class="section-title">Histórico</div>
      ${entries.length ? `<div class="card">${entries.map(e=>`
        <div class="list-item"><div class="list-icon">${icon('bar',18)}</div>
          <div style="flex:1"><div class="list-title">${esc(e.platform)} · ${fmtDate(e.date)}</div><div class="list-sub">${Number(e.followers).toLocaleString('pt-BR')} seguidores · ${Number(e.views).toLocaleString('pt-BR')} views</div></div>
          <div class="swipe-row"><div class="icon-action" data-edit-perf="${e.id}">${icon('pencil',16)}</div><div class="icon-action danger" data-del-perf="${e.id}">${icon('trash',16)}</div></div>
        </div>`).join('')}</div>` : emptyState('bar','Nenhuma métrica registrada ainda','Toque em "Registrar métricas" após postar para acompanhar sua evolução.')}
    </main>`;
}

    const followers = parseFloat(document.getElementById('pf-followers').value);
    if(isNaN(followers)){ showToast('Informe o total de seguidores'); return; }
    const data = { id: existingId || uid(), platform: val('pf-platform'), date: val('pf-date'), followers,
      views: parseFloat(document.getElementById('pf-views').value)||0, likes: parseFloat(document.getElementById('pf-likes').value)||0,
      comments: parseFloat(document.getElementById('pf-comments').value)||0, shares: parseFloat(document.getElementById('pf-shares').value)||0,
      saves: parseFloat(document.getElementById('pf-saves').value)||0 };
    if(existingId){ STATE.performance = STATE.performance.map(p=>p.id===existingId?data:p); } else{ STATE.performance.push(data); }
    await save('performance'); closeModal(); render(); showToast('Métricas salvas');
  });
}

/* ---- Creator Rewards ---- */
const REFERRAL_STATUS = ['Convidado','Cadastrado','Assinante Ativo'];
const REWARD_TIERS = [
  { count:4, label:'1 mês grátis' },
  { count:8, label:'2 meses grátis' },
  { count:12, label:'Selo Premium' },
];
function screenRewards(){
  const link = `akora.app/r/${STATE.referralCode}`;
  const activeCount = STATE.referrals.filter(r=>r.status==='Assinante Ativo').length;
  const registeredCount = STATE.referrals.filter(r=>r.status==='Cadastrado' || r.status==='Assinante Ativo').length;
  const invitedCount = STATE.referrals.length;
  const nextTier = REWARD_TIERS.find(t=>activeCount < t.count);
  const currentTierLabel = [...REWARD_TIERS].reverse().find(t=>activeCount>=t.count);
  const progressPct = nextTier ? Math.min(100, Math.round((activeCount/nextTier.count)*100)) : 100;
  return `
    ${topbar('Seu programa de indicação')}
    <main>
      <div class="card" style="background:var(--brown-600);color:#fff;text-align:center">
        <div class="stat-label" style="color:rgba(255,255,255,0.75)">Seu link de indicação</div>
        <div style="font-family:'Playfair Display';font-size:18px;font-weight:700;margin:var(--s2) 0">${link}</div>
        <div style="display:flex;gap:var(--s3);margin-top:var(--s3)">
          <button class="btn btn-secondary" style="flex:1;background:rgba(255,255,255,0.15);color:#fff;border-color:transparent" id="copyReferralLink">${icon('copy',15)} Copiar link</button>
          <button class="btn btn-secondary" style="flex:1;background:rgba(255,255,255,0.15);color:#fff;border-color:transparent" id="copyReferralCode">${icon('copy',15)} Copiar código</button>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Convidados</div><div class="stat-value">${invitedCount}</div></div>
        <div class="stat-card"><div class="stat-label">Cadastrados</div><div class="stat-value">${registeredCount}</div></div>
      </div>
      <div class="card" style="text-align:center"><div class="stat-label">Assinantes ativos</div><div class="display" style="font-size:28px;color:var(--brown-800)">${activeCount}</div></div>
      <div class="section-title">Progresso de recompensas</div>
      <div class="card">
        ${currentTierLabel ? `<div class="secondary" style="font-size:13px;margin-bottom:var(--s3)">Nível atual: <strong style="color:var(--brown-800)">${currentTierLabel.label}</strong></div>` : ''}
        ${nextTier ? `
          <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
          <div class="secondary" style="font-size:12px;margin-top:var(--s2)">${activeCount}/${nextTier.count} assinantes ativos para desbloquear <strong style="color:var(--brown-800)">${nextTier.label}</strong></div>
        ` : `<div class="secondary" style="font-size:13px">Você desbloqueou todos os níveis disponíveis! 🎉</div>`}
        <div style="display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s4)">
          ${REWARD_TIERS.map(t=>`<div style="display:flex;justify-content:space-between;font-size:12px;color:${activeCount>=t.count?'#5D8A5A':'var(--text-muted)'}"><span>${icon(activeCount>=t.count?'check':'clock',13)} ${t.count} indicações</span><span>${t.label}</span></div>`).join('')}
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin:var(--s4) 0"><button class="btn btn-secondary btn-sm" id="addReferralBtn">${icon('plus',14)} Registrar indicação</button></div>
      <div class="section-title">Suas indicações</div>
      ${STATE.referrals.length ? `<div class="card">${STATE.referrals.map(r=>`
        <div class="list-item"><div class="list-icon">${icon('gift',18)}</div>
          <div style="flex:1"><div class="list-title">${esc(r.name)}</div><div class="list-sub">${fmtDate(r.date)}</div></div>
          <select class="quick-status" data-quickreferral="${r.id}" style="font-size:11px;padding:5px 6px;border-radius:8px;border:1px solid var(--border);color:var(--text-secondary);max-width:120px">${REFERRAL_STATUS.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select>
          <div class="icon-action danger" data-del-referral="${r.id}">${icon('trash',16)}</div>
        </div>`).join('')}</div>` : emptyState('gift','Nenhuma indicação registrada ainda','Compartilhe seu link e registre aqui quando alguém se inscrever.')}
    </main>`;
}
function referralForm(){
  return `
    <div class="modal-header"><div class="modal-title display">Registrar indicação</div><div class="icon-btn" id="closeModal">${icon('x',16)}</div></div>
    <div class="field"><label>Nome da pessoa indicada</label><input id="rf-name" placeholder="Ex: Maria Silva"></div>
    <div class="field-row">
      <div class="field"><label>Status</label><select id="rf-status">${REFERRAL_STATUS.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="field"><label>Data</label><input id="rf-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    </div>
    <button class="btn btn-primary btn-block" id="saveReferralBtn">Adicionar indicação</button>`;
}
function bindReferralSave(){
  document.getElementById('saveReferralBtn').addEventListener('click', async ()=>{
    const name = val('rf-name'); if(!name){ showToast('Informe o nome da pessoa indicada'); return; }
    STATE.referrals.push({ id: uid(), name, status: val('rf-status'), date: val('rf-date') });
    await save('referrals'); closeModal(); render(); showToast('Indicação registrada');
  });
}

/* ---------- Router ---------- */
function render(){
  const el = document.getElementById('screen-content');
  if(STATE.tab==='clients' && STATE.clientDetailId){ el.innerHTML = screenClientDetail(STATE.clientDetailId); }
  else{
    const screens = { home:screenHome, clients:screenClients, content:screenContent, finance:screenFinance, performance:screenPerformance, rewards:screenRewards, settings:screenSettings };
    el.innerHTML = screens[STATE.tab]();
  }
  renderNav();
  bindDynamic();
  document.getElementById('fabBtn').style.display = (['performance','rewards','settings'].includes(STATE.tab) || (STATE.tab==='clients' && STATE.clientDetailId) || (STATE.tab==='content' && contentSub!=='fluxo')) ? 'none' : 'flex';
}

function bindDynamic(){
  document.getElementById('bellBtn')?.addEventListener('click', ()=> openModal(notificationsModal(), bindAssistant));
  document.getElementById('avatarBtn')?.addEventListener('click', ()=>{ STATE.tab='settings'; STATE.clientDetailId=null; render(); });
  document.getElementById('goalCard')?.addEventListener('click', ()=> openModal(goalForm(), bindGoalSave));
  document.querySelectorAll('[data-panelstatus]').forEach(el=> el.addEventListener('click', ()=>{ panelFilters.status = el.dataset.panelstatus; render(); }));
  document.getElementById('panelPlatform')?.addEventListener('change', (e)=>{ panelFilters.platform = e.target.value; render(); });
  document.getElementById('panelNiche')?.addEventListener('change', (e)=>{ panelFilters.niche = e.target.value; render(); });
  document.querySelectorAll('[data-goto]').forEach(el=> el.addEventListener('click', ()=>{
    STATE.tab = el.dataset.goto; STATE.clientDetailId=null;
    if(el.dataset.goto==='content'){ contentSub = el.dataset.sub || 'fluxo'; }
    render();
  }));
  document.getElementById('btnBack')?.addEventListener('click', ()=>{ STATE.clientDetailId=null; STATE.moreView=null; render(); });

  // clients
  document.querySelectorAll('[data-clientssub]').forEach(el=> el.addEventListener('click', ()=>{ clientsSub = el.dataset.clientssub; render(); }));
  document.querySelectorAll('[data-filter]').forEach(el=> el.addEventListener('click', ()=>{ clientFilter = el.dataset.filter; render(); }));
  document.querySelectorAll('[data-open-client]').forEach(el=> el.addEventListener('click', ()=>{ STATE.clientDetailId = el.dataset.openClient; render(); }));
  document.querySelectorAll('[data-view-contract]').forEach(el=> el.addEventListener('click', ()=> openModal(contractViewModal(el.dataset.viewContract), ()=>{
    document.getElementById('copyContractView')?.addEventListener('click', ()=>{
      const ct = STATE.contracts.find(c=>c.id===el.dataset.viewContract);
      navigator.clipboard.writeText(ct.text); showToast('Contrato copiado');
    });
  })));
  document.getElementById('genContractPickClient')?.addEventListener('click', ()=> openModal(pickClientForContractModal(), ()=>{
    document.getElementById('pickClientConfirm')?.addEventListener('click', ()=>{
      const client = STATE.clients.find(c=>c.id===document.getElementById('pickClientSelect').value);
      if(client) openModal(contractForm(client), ()=>bindContractGenerate(client));
    });
  }));
  document.getElementById('editClientBtn')?.addEventListener('click', ()=> openModal(clientForm(STATE.clients.find(c=>c.id===STATE.clientDetailId)), ()=>bindClientSave(STATE.clientDetailId)));
  document.getElementById('delClientBtn')?.addEventListener('click', async ()=>{
    STATE.clients = STATE.clients.filter(c=>c.id!==STATE.clientDetailId); await save('clients');
    STATE.clientDetailId=null; render(); showToast('Cliente removido');
  });
  document.getElementById('aiContractBtn')?.addEventListener('click', ()=>{
    const client = STATE.clients.find(c=>c.id===STATE.clientDetailId);
    openModal(contractForm(client), ()=>bindContractGenerate(client));
  });

  // content flow
  document.querySelectorAll('[data-quickstatus-main]').forEach(el=> el.addEventListener('change', async (e)=>{
    const item = STATE.content.find(c=>c.id===el.dataset.quickstatusMain);
    if(item){ item.status = e.target.value; await save('content'); render(); showToast('Status atualizado'); }
  }));
  document.querySelectorAll('[data-edit-content]').forEach(el=> el.addEventListener('click', ()=> openModal(contentForm(STATE.content.find(c=>c.id===el.dataset.editContent)), ()=>bindContentSave(el.dataset.editContent))));
  document.querySelectorAll('[data-del-content]').forEach(el=> el.addEventListener('click', async ()=>{ STATE.content = STATE.content.filter(c=>c.id!==el.dataset.delContent); await save('content'); render(); showToast('Conteúdo removido'); }));
  document.querySelectorAll('[data-csub]').forEach(el=> el.addEventListener('click', ()=>{ contentSub = el.dataset.csub; render(); }));
  document.querySelectorAll('[data-gradefilter]').forEach(el=> el.addEventListener('click', ()=>{ gradeFilter = el.dataset.gradefilter; render(); }));
  document.querySelectorAll('[data-calnav]').forEach(el=> el.addEventListener('click', ()=>{
    let m = calState.month + parseInt(el.dataset.calnav);
    let y = calState.year;
    if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    calState.month = m; calState.year = y; render();
  }));
  document.querySelectorAll('[data-day]').forEach(el=> el.addEventListener('click', ()=>{
    const day = el.dataset.day;
    calState.selected = day;
    const hasContent = STATE.content.some(c=>c.dueDate===day);
    render();
    if(hasContent){ openModal(dayDetailModal(day), ()=>bindDayDetail(day)); }
    else{ openModal(contentForm(null, day), ()=>bindContentSave(null)); }
  }));

  // ideas
  document.getElementById('addIdeaBtn')?.addEventListener('click', ()=> openModal(ideaForm(null), ()=>bindIdeaSave(null)));
  document.getElementById('ideaFilterNiche')?.addEventListener('change', (e)=>{ ideaFilters.niche = e.target.value; render(); });
  document.querySelectorAll('[data-edit-idea]').forEach(el=> el.addEventListener('click', ()=> openModal(ideaForm(STATE.ideas.find(i=>i.id===el.dataset.editIdea)), ()=>bindIdeaSave(el.dataset.editIdea))));
  document.querySelectorAll('[data-del-idea]').forEach(el=> el.addEventListener('click', async ()=>{ STATE.ideas = STATE.ideas.filter(i=>i.id!==el.dataset.delIdea); await save('ideas'); render(); showToast('Ideia removida'); }));
  document.querySelectorAll('[data-convert-idea]').forEach(el=> el.addEventListener('click', async ()=>{
    const idea = STATE.ideas.find(i=>i.id===el.dataset.convertIdea);
    STATE.content.push({ id: uid(), title: idea.title, platform: idea.platform, format: idea.format||'Reels', niche: idea.niche||'', client:'', status:'Ideia', dueDate:'' });
    idea.converted = true;
    await save('content'); await save('ideas'); contentSub='fluxo'; render(); showToast('Ideia convertida em conteúdo');
  }));

  // AI studio
  document.querySelectorAll('[data-ai]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const kind = el.dataset.ai;
      if(kind==='script') openModal(scriptForm(), bindScriptGenerate);
      else if(kind==='briefing') openModal(briefingForm(), bindBriefingGenerate);
      else if(kind==='post') openModal(postForm(), bindPostGenerate);
    });
  });

  // pricing
  document.getElementById('calcPriceBtn') && bindPricing();

  // finance
  document.querySelectorAll('[data-fsub]').forEach(el=> el.addEventListener('click', ()=>{ STATE.financeSub = el.dataset.fsub; render(); }));
  document.getElementById('financeYear')?.addEventListener('change', (e)=>{ financeFilter.year = parseInt(e.target.value); render(); });
  document.getElementById('financeMonth')?.addEventListener('change', (e)=>{ financeFilter.month = e.target.value; render(); });
  document.querySelectorAll('[data-tksub]').forEach(el=> el.addEventListener('click', ()=>{ STATE.tiktokSub = el.dataset.tksub; render(); }));
  document.querySelectorAll('[data-edit-tiktok]').forEach(el=> el.addEventListener('click', ()=> openModal(tiktokForm(STATE.tiktok.find(p=>p.id===el.dataset.editTiktok)), ()=>bindTiktokSave(el.dataset.editTiktok))));
  document.querySelectorAll('[data-del-tiktok]').forEach(el=> el.addEventListener('click', async ()=>{ STATE.tiktok = STATE.tiktok.filter(p=>p.id!==el.dataset.delTiktok); await save('tiktok'); render(); showToast('Produto removido'); }));
  document.querySelectorAll('[data-copy-link]').forEach(el=> el.addEventListener('click', ()=>{ navigator.clipboard.writeText(el.dataset.copyLink); showToast('Link copiado'); }));

  // settings (top-level page)
  document.getElementById('saveSettingsBtn') && bindSettingsSave();

  // performance & rewards (top-level pages)
  document.querySelectorAll('[data-perfplatform]').forEach(el=> el.addEventListener('click', ()=>{ perfPlatformFilter = el.dataset.perfplatform; render(); }));
  document.getElementById('addPerfBtn')?.addEventListener('click', ()=> openModal(performanceForm(null), ()=>bindPerfSave(null)));
  document.querySelectorAll('[data-edit-perf]').forEach(el=> el.addEventListener('click', ()=> openModal(performanceForm(STATE.performance.find(p=>p.id===el.dataset.editPerf)), ()=>bindPerfSave(el.dataset.editPerf))));
  document.querySelectorAll('[data-del-perf]').forEach(el=> el.addEventListener('click', async ()=>{ STATE.performance = STATE.performance.filter(p=>p.id!==el.dataset.delPerf); await save('performance'); render(); showToast('Registro removido'); }));
  document.getElementById('copyReferralLink')?.addEventListener('click', ()=>{ navigator.clipboard.writeText(`akora.app/r/${STATE.referralCode}`); showToast('Link copiado'); });
  document.getElementById('copyReferralCode')?.addEventListener('click', ()=>{ navigator.clipboard.writeText(STATE.referralCode); showToast('Código copiado'); });
  document.getElementById('addReferralBtn')?.addEventListener('click', ()=> openModal(referralForm(), bindReferralSave));
  document.querySelectorAll('[data-quickreferral]').forEach(el=> el.addEventListener('change', async (e)=>{
    const r = STATE.referrals.find(x=>x.id===el.dataset.quickreferral);
    if(r){ r.status = e.target.value; await save('referrals'); render(); showToast('Status da indicação atualizado'); }
  }));
  document.querySelectorAll('[data-del-referral]').forEach(el=> el.addEventListener('click', async ()=>{
    STATE.referrals = STATE.referrals.filter(r=>r.id!==el.dataset.delReferral); await save('referrals'); render(); showToast('Indicação removida');
  }));
}

/* ---------- Modal ---------- */
function openModal(html, bindFn){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeModal').addEventListener('click', closeModal);
  if(bindFn) bindFn();
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); document.getElementById('modalBody').innerHTML=''; }
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

function bindClientSave(existingId){
  document.getElementById('saveClient').addEventListener('click', async ()=>{
    const name = val('f-name'); if(!name){ showToast('Informe o nome do cliente'); return; }
    const data = { id: existingId || uid(), name, contact: val('f-contact'), phone: val('f-phone'), instagram: val('f-instagram'), dealPlatform: val('f-dealplatform'), status: val('f-status'), notes: val('f-notes') };
    if(existingId){ STATE.clients = STATE.clients.map(c=>c.id===existingId?data:c); } else{ STATE.clients.push(data); }
    await save('clients'); closeModal(); render(); showToast('Cliente salvo');
  });
}
function bindContentSave(existingId){
  document.getElementById('f-idea')?.addEventListener('change', (e)=>{
    const idea = STATE.ideas.find(i=>i.id===e.target.value);
    if(idea){
      document.getElementById('f-title').value = idea.title;
      const platSel = document.getElementById('f-platform'); if(platSel && idea.platform) platSel.value = idea.platform;
      const nicheSel = document.getElementById('f-niche'); if(nicheSel && idea.niche) nicheSel.value = idea.niche;
      const formatSel = document.getElementById('f-format'); if(formatSel && idea.format) formatSel.value = idea.format;
    }
  });
  document.getElementById('saveContent').addEventListener('click', async ()=>{
    const title = val('f-title'); if(!title){ showToast('Informe o título'); return; }
    const existingItem = existingId ? STATE.content.find(c=>c.id===existingId) : null;
    const data = { id: existingId || uid(), title, platform: val('f-platform'), format: val('f-format'), niche: val('f-niche'), dueDate: val('f-duedate'), client: val('f-client'), status: val('f-cstatus'), script: existingItem?existingItem.script:'' };
    if(existingId){ STATE.content = STATE.content.map(c=>c.id===existingId?data:c); } else{ STATE.content.push(data); }
    const ideaId = document.getElementById('f-idea')?.value;
    if(ideaId){ const idea = STATE.ideas.find(i=>i.id===ideaId); if(idea){ idea.converted = true; await save('ideas'); } }
    await save('content'); closeModal(); render(); showToast('Conteúdo salvo');
  });
}
function bindIdeaSave(existingId){
  document.getElementById('saveIdea').addEventListener('click', async ()=>{
    const title = val('fi-title'); if(!title){ showToast('Informe o título da ideia'); return; }
    const data = { id: existingId || uid(), title, platform: val('fi-platform'), format: val('fi-format'), niche: val('fi-niche'), referenceLink: val('fi-ref'), description: val('fi-desc'), priority: val('fi-priority'), converted: existingId ? STATE.ideas.find(i=>i.id===existingId).converted : false };
    if(existingId){ STATE.ideas = STATE.ideas.map(i=>i.id===existingId?data:i); } else{ STATE.ideas.push(data); }
    await save('ideas'); closeModal(); render(); showToast('Ideia salva');
  });
}
function bindFinanceSave(existingId){
  document.getElementById('f-fclient')?.addEventListener('change', (e)=>{
    const client = STATE.clients.find(c=>c.name===e.target.value);
    const sel = document.getElementById('f-dealplatform-tx');
    if(client && client.dealPlatform && sel && !sel.dataset.touched){ sel.value = client.dealPlatform; }
  });
  document.getElementById('f-dealplatform-tx')?.addEventListener('change', (e)=>{ e.target.dataset.touched = '1'; });
  document.getElementById('saveFinance').addEventListener('click', async ()=>{
    const description = val('f-desc'); const amount = parseFloat(document.getElementById('f-amount').value);
    if(!description || !amount){ showToast('Preencha descrição e valor'); return; }
    const data = { id: existingId || uid(), description, type: val('f-type'), amount, date: val('f-date'), status: val('f-fstatus'), client: val('f-fclient'), method: val('f-method'), dealPlatform: val('f-dealplatform-tx') };
    if(existingId){ STATE.transactions = STATE.transactions.map(t=>t.id===existingId?data:t); } else{ STATE.transactions.push(data); }
    await save('transactions'); closeModal(); render(); showToast('Lançamento salvo');
  });
}
function bindTiktokSave(existingId){
  document.getElementById('saveTiktok').addEventListener('click', async ()=>{
    const product = val('tk-product'); if(!product){ showToast('Informe o nome do produto'); return; }
    const data = { id: existingId || uid(), product, category: val('tk-category'), commission: parseFloat(document.getElementById('tk-commission').value)||0, sales: parseInt(document.getElementById('tk-sales').value)||0, earnings: parseFloat(document.getElementById('tk-earnings').value)||0, link: val('tk-link') };
    if(existingId){ STATE.tiktok = STATE.tiktok.map(p=>p.id===existingId?data:p); } else{ STATE.tiktok.push(data); }
    await save('tiktok'); closeModal(); render(); showToast('Produto salvo');
  });
}

/* ---------- FAB ---------- */
document.getElementById('fabBtn').addEventListener('click', ()=>{
  if(STATE.tab==='clients') openModal(clientForm(null), ()=>bindClientSave(null));
  else if(STATE.tab==='content') openModal(contentForm(null), ()=>bindContentSave(null));
  else if(STATE.tab==='finance'){
    if(STATE.financeSub==='tiktok') openModal(tiktokForm(null), ()=>bindTiktokSave(null));
    else openModal(financeForm(null), ()=>bindFinanceSave(null));
  }
  else openModal(clientForm(null), ()=>bindClientSave(null));
});

/* ---------- Init ---------- */
(async function init(){ await loadAll(); render(); })();
</script>
</body>
</html>
